# Supabase CLI configuration.
#
# Used by `supabase link`, `supabase db push` and the local stack. The project
# ref is supplied by `supabase link --project-ref <ref>` and is not committed.

project_id = "am-express-trading"

[db]
port = 54322
major_version = 16

[db.migrations]
enabled = true

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Staff accounts are created by an administrator inside the application. Public
# sign-up is off: this is a business's internal system, not a service anyone
# joins. Even with it on, a new account would only ever be a cashier — the
# trigger in the first migration refuses to read a role from sign-up metadata.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[studio]
enabled = true
port = 54323

[storage]
enabled = false

[realtime]
enabled = false
